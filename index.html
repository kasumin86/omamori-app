<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心のおまもり＆デトックス</title>
    <style>
        :root {
            --primary: #8CA695;
            --primary-dark: #6D8577;
            --bg: #F7F9F6;
            --card-bg: #FFFFFF;
            --text: #3A443B;
            --text-light: #7A8A7C;
            --shadow: 0 4px 20px rgba(140, 166, 149, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px 16px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 10px 0 16px 0;
        }

        header h1 {
            font-size: 1.3rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
            font-weight: 600;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .nav {
            display: flex;
            background: #EAEFEA;
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .nav-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
            border-radius: 24px;
            cursor: pointer;
        }

        .nav-btn.active {
            background: var(--card-bg);
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-weight: 600;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            background: var(--primary);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 166, 149, 0.3);
            margin-top: 12px;
        }

        .action-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* GACHA BOX */
        .gacha-box {
            background: linear-gradient(135deg, #F0F5F1 0%, #E2EDE4 100%);
            border-radius: 12px;
            padding: 24px 16px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 2px dashed var(--primary);
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.7;
            font-weight: 500;
        }

        /* WORK & CRUMPLE */
        .work-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 4px;
