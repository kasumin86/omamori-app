<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こころおまもり＆デトックス</title>
    <style>
        :root {
            --primary: #8CA695;
            --primary-dark: #6D8577;
            --accent: #E8D5C4;
            --bg: #F7F9F6;
            --card-bg: #FFFFFF;
            --text: #3A443B;
            --text-light: #7A8A7C;
            --shadow: 0 4px 20px rgba(140, 166, 149, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        header h1 {
            font-size: 1.25rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
            font-weight: 600;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            background: #EAEFEA;
            border-radius: 30px;
            padding: 4px;
            margin: 16px 0 24px 0;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-weight: 600;
        }

        .tab-content {
            display: none;
            flex: 1;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* カード共通スタイル */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px 20px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
        }

        /* ガチャセクション */
        .gacha-section {
            text-align: center;
        }

        .gacha-card {
            background: linear-gradient(135deg, #F0F5F1 0%, #E2EDE4 100%);
            border-radius: 12px;
            padding: 32px 20px;
            min-height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px dashed var(--primary);
        }

        .gacha-text {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--text);
            font-weight: 500;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 166, 149, 0.3);
            transition: background 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .gacha-limit-msg {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 10px;
        }

        /* ワークセクション */
        .work-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }

        .work-desc {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid #D5DDD6;
            border-radius: 10px;
            font-size: 0.9rem;
            resize: none;
            background: #FAFAFA;
            outline: none;
            margin-bottom: 16px;
        }

        textarea:focus {
            border-color: var(--primary);
            background: #FFF;
        }

        .step-box {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #EFEFEF;
        }

        .step-box:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* カンペセクション */
        .kanpe-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .kanpe-tab {
            background: #EAEFEA;
            border: none;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            white-space: nowrap;
        }

        .kanpe-tab.active {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .kanpe-card {
            background: #FAFCFA;
            border-left: 4px solid var(--primary);
            padding: 14px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 12px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .kanpe-card strong {
            display: block;
            color: var(--primary-dark);
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        /* くしゃくしゃアニメーション用 */
        @keyframes crinkle {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(0.5) rotate(15deg) skew(10deg); opacity: 0.5; }
            100% { transform: scale(0) rotate(45deg); opacity: 0; }
        }

        .crinkling {
            animation: crinkle 0.6s forwards ease-in-out;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-light);
            padding: 20px 0 10px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>心のおまもり＆デトックス</h1>
        <p>今日もよく耐えたあなたへ。肩の力を抜く場所。</p>
    </header>

    <!-- タブメニュー -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('gacha')">今日のお守り</button>
        <button class="tab-btn" onclick="switchTab('work')">モヤモヤ仕分け</button>
        <button class="tab-btn" onclick="switchTab('kanpe')">行動カンペ</button>
    </div>
