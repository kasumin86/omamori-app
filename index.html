<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>こころおまもり＆デトックス</title>
    <style>
        :root {
            --primary: #8CA695;
            --primary-dark: #6D8577;
            --bg: #F7F9F6;
            --card-bg: #FFFFFF;
            --text: #3A443B;
            --text-light: #7A8A7C;
            --shadow: 0 4px 20px rgba(140, 166, 149, 0.12);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 16px 0 8px 0;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--primary-dark);
            margin-bottom: 4px;
            font-weight: 600;
        }

        header p {
            font-size: 0.8rem;
            color: var(--text-light);
        }

        .tab-nav {
            display: flex;
            background: #EAEFEA;
            border-radius: 30px;
            padding: 4px;
            margin: 12px 0 20px 0;
        }

        .tab-btn {
            flex: 1;
            border: none;
            background: transparent;
            padding: 10px 0;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-light);
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background: var(--card-bg);
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-weight: 600;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px 16px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        .gacha-section {
            text-align: center;
        }

        .gacha-card {
            background: linear-gradient(135deg, #F0F5F1 0%, #E2EDE4 100%);
            border-radius: 12px;
            padding: 24px 16px;
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            border: 1px dashed var(--primary);
        }

        .gacha-text {
            font-size: 0.95rem;
            line-height: 1.7;
            color: var(--text);
            font-weight: 500;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(140, 166, 149, 0.3);
        }

        .btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .gacha-limit-msg {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 10px;
        }

        .work-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .work-desc {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            height: 80px;
            padding: 10px;
            border: 1px solid #D5DDD6;
            border-radius: 10px;
            font-size: 0.85rem;
            resize: none;
            background: #FAFAFA;
            outline: none;
            margin-bottom: 16px;
        }

        .step-box {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #EFEFEF;
        }

        .step-box:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .kanpe-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .kanpe-tab {
            flex: 1;
            background: #EAEFEA;
            border: none;
            padding: 8px 4px;
            border-radius: 16px;
            font-size: 0.75rem;
            color: var(--text-light);
            cursor: pointer;
            text-align: center;
        }

        .kanpe-tab.active {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .kanpe-card {
            background: #FAFCFA;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 10px;
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .kanpe-card strong {
            display: block;
            color: var(--primary-dark);
            margin-bottom: 4px;
            font-size: 0.8rem;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-light);
            padding: 16px 0 8px 0;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>心のおまもり＆デトックス</h1>
        <p>今日もよく耐えたあなたへ。肩の力を抜く場所。</p>
    </header>

    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('gacha')">今日のお守り</button>
        <button class="tab-btn" onclick="switchTab('work')">モヤモヤ仕分け</button>
        <button class="tab-btn" onclick="switchTab('kanpe')">行動カンペ</button>
    </div>

    <!-- TAB 1: ガチャ -->
    <div id="tab-gacha" class="tab-content active">
        <div class="card gacha-section">
            <p style="font-size: 0.8rem; color: var(--text-light); margin-bottom: 12px;">1日1回引ける、あなたへのメッセージ</p>
            <div class="gacha-card">
                <div id="gachaResult" class="gacha-text">ボタンを押して、今日のお守り言葉を受け取ってね🌿</div>
            </div>
            <button id="gachaBtn" class="btn" onclick="drawGacha()">✨ 今日のお守りを受け取る</button>
            <div id="gachaLimitMsg" class="gacha-limit-msg"></div>
        </div>
    </div>

    <!-- TAB 2: ワーク -->
    <div id="tab-work" class="tab-content">
        <div class="card" id="workCard">
            <div class="step-box">
                <div class="work-title">STEP 1｜モヤモヤを吐き出す</div>
                <div class="work-desc">今頭の中にある嫌なこと・不安をそのまま書いてね。</div>
                <textarea id="workStep1" placeholder="例：目も合わせてくれなかった。私何かしたかな…"></textarea>
            </div>

            <div class="step-box">
                <div class="work-title">STEP 2｜事実と妄想を切り分ける</div>
                <div class="work-desc">「事実」と「深読み・妄想」を分けてみよう。</div>
                <textarea id="workStep2" placeholder="【事実】目が合わなかっただけ。&#10;【妄想】嫌われている、私のせいだ。"></textarea>
            </div>

            <div class="step-box">
                <div class="work-title">STEP 3｜自分ルール（避難訓練）</div>
                <div class="work-desc">「こうなったらこうする」の対策を決めておこう。</div>
                <textarea id="workStep3" placeholder="【ルール】挨拶だけして、我が子に意識を集中！"></textarea>
            </div>

            <button class="btn" onclick="detoxWork()" style="background: #D98282;">💥 モヤモヤを消去する</button>
        </div>
    </div>

    <!-- TAB 3: カンペ -->

        <div class="card">
            <div class="kanpe-tabs">
                <button class="kanpe-tab active" onclick="switchKanpe('omukae', this)">お迎え・すれ違い</button>
                <button class="kanpe-tab" onclick="switchKanpe('gyoji', this)">参観日・行事</button>
                <button class="kanpe-tab" onclick="switchKanpe('line', this)">LINE・連絡</button>
            </div>
