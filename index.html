<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心のおまもり＆デトックス</title>
    <style>
        body {
            font-family: sans-serif;
            background: #F7F9F6;
            color: #3A443B;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }
        h1 {
            font-size: 1.2rem;
            text-align: center;
            color: #6D8577;
        }
        .box {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-top: 20px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: #8CA695;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>心のおまもり＆デトックス</h1>

    <div class="box">
        <p id="gachaText">ボタンを押して、今日のエールを受け取ってね🌿</p>
        <button onclick="runGacha()">🎁 ガチャを回す</button>
    </div>

    <script>
        const messages = [
            "相手の機嫌は相手の持ち物。あなたが背負う必要はありません。",
            "挨拶をした。それだけであなたの勝ち！返事は相手の問題です。",
            "誰にでも好かれる必要はありません。自分が自分を好きなら満点！",
            "今日無事に過ごせただけで大成功。よく頑張ったね！"
        ];

        function runGacha() {
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            document.getElementById('gachaText').textContent = randomMsg;
        }
    </script>

</body>
</html>
